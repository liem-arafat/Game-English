<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 English Quest - By Liem Arafat</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #333;
  }
  .game-container {
    background: #ffffff;
    border-radius: 25px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    max-width: 720px;
    width: 100%;
    padding: 25px;
    text-align: center;
    border: 6px solid #FFD166;
    position: relative;
  }
  .game-logo {
    max-width: 300px;
    width: 80%;
    height: auto;
    margin: 0 auto 10px auto;
    display: block;
    border-radius: 15px;
  }
  .top-controls {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .sfx-toggle {
    background: #F1F3F5;
    border: 2px solid #DEE2E6;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: #495057;
  }
  .screen {
    display: none;
  }
  .screen.active {
    display: block;
  }
  .input-box {
    margin: 20px auto;
    max-width: 400px;
  }
  .name-input {
    width: 100%;
    padding: 14px 18px;
    font-size: 18px;
    border: 3px solid #118AB2;
    border-radius: 15px;
    text-align: center;
    font-family: inherit;
    outline: none;
  }
  .name-input:focus {
    border-color: #EF476F;
  }
  .btn-primary {
    background: #EF476F;
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 0 #B52B4C;
    transition: transform 0.1s;
    margin: 8px;
    font-family: inherit;
  }
  .btn-primary:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #B52B4C;
  }
  .btn-secondary {
    background: #118AB2;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 0 #073B4C;
    transition: transform 0.1s;
    margin: 6px;
    font-family: inherit;
  }
  .btn-secondary:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #073B4C;
  }
  .btn-success {
    background: #06D6A0;
    color: #073B4C;
    border: none;
    padding: 12px 24px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 0 #049A73;
    margin: 6px;
    font-family: inherit;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: #F8F9FA;
    padding: 10px 16px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 16px;
    border: 2px solid #E9ECEF;
  }
  .visual-box {
    background: #FFF8E7;
    border: 3px dashed #FFB703;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .emoji-art {
    font-size: 56px;
    letter-spacing: 8px;
    margin-bottom: 8px;
  }
  .scene-caption {
    font-size: 15px;
    color: #555;
    font-style: italic;
  }
  .question-text {
    font-size: 21px;
    font-weight: bold;
    margin: 16px 0 20px 0;
    line-height: 1.4;
    color: #073B4C;
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 520px) {
    .options-grid {
      grid-template-columns: 1fr;
    }
  }
  .option-btn {
    background: #06D6A0;
    color: #073B4C;
    border: none;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 5px 0 #049A73;
    transition: all 0.15s;
    font-family: inherit;
  }
  .option-btn:hover:not(:disabled) {
    background: #08F2B5;
  }
  .option-btn:disabled {
    opacity: 0.85;
    cursor: not-allowed;
  }
  .feedback {
    margin-top: 18px;
    font-size: 18px;
    font-weight: bold;
    min-height: 28px;
  }
  .leaderboard-box {
    background: #F8F9FA;
    border-radius: 18px;
    padding: 15px;
    margin-top: 20px;
    border: 2px solid #DEE2E6;
    text-align: left;
  }
  .leaderboard-box h3 {
    margin: 0 0 10px 0;
    text-align: center;
    color: #073B4C;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid #DEE2E6;
    text-align: left;
  }
  th {
    background: #E9ECEF;
    color: #073B4C;
  }
  .cert-preview {
    max-width: 100%;
    border-radius: 12px;
    border: 4px solid #FFD166;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    margin: 15px 0;
  }
</style>
</head>

let playerName = "";
let currentIdx = 0;
let score = 0;
let secondsElapsed = 0;
let timerInterval = null;
let sfxEnabled = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleSFX() {
  sfxEnabled = !sfxEnabled;
  document.getElementById('sfx-btn').innerText = sfxEnabled ? "🎵 Sound Effects: ON" : "🔇 Sound Effects: OFF";
}

function playTone(freq, type, startTime, duration, vol = 0.2) {
  if (!sfxEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playStartSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playTone(523.25, 'triangle', now, 0.12);
  playTone(659.25, 'triangle', now + 0.1, 0.12);
  playTone(783.99, 'triangle', now + 0.2, 0.25);
}

function playCorrectSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playTone(587.33, 'sine', now, 0.12, 0.25);
  playTone(880.00, 'sine', now + 0.1, 0.35, 0.25);
}

function playWrongSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playTone(300, 'sawtooth', now, 0.18, 0.18);
  playTone(220, 'sawtooth', now + 0.16, 0.3, 0.18);
}

function playFanfareSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playTone(523.25, 'triangle', now, 0.15, 0.25);
  playTone(659.25, 'triangle', now + 0.14, 0.15, 0.25);
  playTone(783.99, 'triangle', now + 0.28, 0.15, 0.25);
  playTone(1046.50, 'triangle', now + 0.42, 0.5, 0.3);
}

function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.92;
    utterance.pitch = 1.1;
    window.speechSynthesis.speak(utterance);
  }
}

function speakQuestion() {
  speakText(questions[currentIdx].voice);
}

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startGame() {
  const input = document.getElementById('student-name').value.trim();
  if (!input) {
    alert("Please enter your name first!");
    return;
  }
  playerName = input;
  currentIdx = 0;
  score = 0;
  secondsElapsed = 0;
  playStartSound();

  document.getElementById('player-display').innerText = `👤 ${playerName}`;
  document.getElementById('score-display').innerText = `🌟 0`;
  document.getElementById('timer-display').innerText = `⏱️ 0s`;

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    secondsElapsed++;
    document.getElementById('timer-display').innerText = `⏱️ ${secondsElapsed}s`;
  }, 1000);

  switchScreen('quiz-screen');
  loadQuestion();
}

function loadQuestion() {
  const q = questions[currentIdx];
  document.getElementById('level-display').innerText = `Q: ${currentIdx + 1} / ${questions.length}`;
  document.getElementById('visual-emoji').innerText = q.emoji;
  document.getElementById('visual-desc').innerText = q.desc;
  document.getElementById('question-text').innerText = q.text;
  document.getElementById('feedback').innerText = "";
  document.getElementById('next-btn').style.display = "none";

  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(opt, btn);
    optionsContainer.appendChild(btn);
  });

  setTimeout(() => speakQuestion(), 450);
}

function checkAnswer(selected, btnElement) {
  const q = questions[currentIdx];
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  const feedback = document.getElementById('feedback');
  if (selected === q.answer) {
    score += 10;
    document.getElementById('score-display').innerText = `🌟 ${score}`;
    btnElement.style.background = "#FFD166";
    feedback.style.color = "#06D6A0";
    feedback.innerText = "🎉 " + q.explanation;
    playCorrectSound();
    setTimeout(() => speakText("Great job! " + q.explanation), 250);
  } else {
    btnElement.style.background = "#EF476F";
    btnElement.style.color = "white";
    feedback.style.color = "#EF476F";
    feedback.innerText = `❌ Oops! The correct answer is "${q.answer}".`;
    playWrongSound();
    setTimeout(() => speakText("Oops! The correct answer is " + q.answer), 300);
  }

  document.getElementById('next-btn').style.display = "inline-block";
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < questions.length) {
    loadQuestion();
  } else {
    finishGame();
  }
}

function finishGame() {
  clearInterval(timerInterval);
  playFanfareSound();
  switchScreen('result-screen');

  const maxScore = questions.length * 10;
  document.getElementById('final-summary').innerText =
    `Great work, ${playerName}! Score: ${score} / ${maxScore} in ${secondsElapsed} seconds.`;
  document.getElementById('cert-image').style.display = "inline-block";
  document.querySelector('.btn-success').style.display = "inline-block";

  generateCertificate();
  saveAndLoadLeaderboard(playerName, score, `${secondsElapsed}s`);
  setTimeout(() => speakText(`Congratulations ${playerName}! Your final score is ${score} points.`), 600);
}

function generateCertificate() {
  const canvas = document.getElementById('cert-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Background
  ctx.fillStyle = "#FFFDF7";
  ctx.fillRect(0, 0, W, H);

  // Outer & Inner Borders
  ctx.strokeStyle = "#118AB2";
  ctx.lineWidth = 14;
  ctx.strokeRect(20, 20, W - 40, H - 40);

  ctx.strokeStyle = "#FFD166";
  ctx.lineWidth = 6;
  ctx.strokeRect(38, 38, W - 76, H - 76);

  // Header
  ctx.fillStyle = "#EF476F";
  ctx.font = "bold 40px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("CERTIFICATE OF ACHIEVEMENT", W / 2, 115);

  ctx.fillStyle = "#118AB2";
  ctx.font = "bold 20px 'Segoe UI', sans-serif";
  ctx.fillText("GRADE 6 ENGLISH QUEST: SIMILARITY & PREFERENCE", W / 2, 155);

  ctx.fillStyle = "#555555";
  ctx.font = "italic 20px 'Segoe UI', sans-serif";
  ctx.fillText("This certificate is proudly awarded to", W / 2, 210);

  // Student Name
  ctx.fillStyle = "#073B4C";
  ctx.font = "bold 46px 'Comic Sans MS', sans-serif";
  ctx.fillText(playerName, W / 2, 275);

  // Underline
  ctx.strokeStyle = "#06D6A0";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(200, 292);
  ctx.lineTo(W - 200, 292);
  ctx.stroke();

  // Score & Predicate
  const maxScore = questions.length * 10;
  let predicate = "Good Effort!";
  if (score === maxScore) predicate = "Outstanding Master! 🌟";
  else if (score >= 60) predicate = "Great Achiever! 🎉";

  ctx.fillStyle = "#333333";
  ctx.font = "22px 'Segoe UI', sans-serif";
  ctx.fillText(`For successfully completing the mission with a score of`, W / 2, 345);

  ctx.fillStyle = "#EF476F";
  ctx.font = "bold 30px 'Comic Sans MS', sans-serif";
  ctx.fillText(`${score} / ${maxScore} (${predicate}) • Time: ${secondsElapsed}s`, W / 2, 392);

  // Date & Signature
  const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  ctx.fillStyle = "#555555";
  ctx.font = "18px 'Segoe UI', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`Date: ${today}`, 95, 515);

  ctx.textAlign = "right";
  ctx.font = "italic bold 24px 'Comic Sans MS', sans-serif";
  ctx.fillStyle = "#073B4C";
  ctx.fillText("Liem Arafat", W - 115, 495);

  ctx.font = "16px 'Segoe UI', sans-serif";
  ctx.fillStyle = "#555555";
  ctx.fillText("Game Creator & Educator", W - 95, 522);

  document.getElementById('cert-image').src = canvas.toDataURL('image/png');
}

function downloadCertificate() {
  const link = document.createElement('a');
  const safeName = playerName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  link.download = `Certificate_${safeName}.png`;
  link.href = document.getElementById('cert-canvas').toDataURL('image/png');
  link.click();
}

function resetToStart() {
  window.speechSynthesis.cancel();
  switchScreen('start-screen');
}

function showLeaderboardOnly() {
  switchScreen('result-screen');
  document.getElementById('final-summary').innerText = "Hall of Fame - Top English Explorers!";
  document.getElementById('cert-image').style.display = "none";
  document.querySelector('.btn-success').style.display = "none";
  loadLeaderboard();
}

async function saveAndLoadLeaderboard(name, scoreVal, timeStr) {
  // Simpan di LocalStorage
  let localScores = JSON.parse(localStorage.getItem('g6_english_quest_scores') || '[]');
  localScores.push({ name: name, score: scoreVal, time: timeStr, rawTime: secondsElapsed });
  localScores.sort((a, b) => b.score - a.score || (a.rawTime || 999) - (b.rawTime || 999));
  localScores = localScores.slice(0, 10);
  localStorage.setItem('g6_english_quest_scores', JSON.stringify(localScores));

  if (GOOGLE_SCRIPT_URL) {
    document.getElementById('sync-status').innerText = "Syncing with online class leaderboard...";
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, score: scoreVal, time: timeStr })
      });
      setTimeout(loadLeaderboard, 1200);
      return;
    } catch (e) {
      console.error(e);
    }
  }
  renderLeaderboard(localScores, "Saved on this device");
}

async function loadLeaderboard() {
  if (GOOGLE_SCRIPT_URL) {
    document.getElementById('sync-status').innerText = "Loading online leaderboard...";
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const data = await res.json();
      data.sort((a, b) => b.score - a.score || parseInt(a.time) - parseInt(b.time));
      renderLeaderboard(data.slice(0, 10), "Live Online Class Leaderboard");
      return;
    } catch (e) {
      console.error(e);
    }
  }
  const localScores = JSON.parse(localStorage.getItem('g6_english_quest_scores') || '[]');
  renderLeaderboard(localScores, "Device Leaderboard");
}

function renderLeaderboard(list, statusText) {
  document.getElementById('sync-status').innerText = statusText;
  const tbody = document.getElementById('leaderboard-body');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No scores recorded yet. Be the first!</td></tr>';
    return;
  }
  tbody.innerHTML = list.map((item, idx) => `
    <tr>
      <td><b>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}</b></td>
      <td>${escapeHtml(item.name)}</td>
      <td><b>${item.score}</b></td>
      <td>${escapeHtml(String(item.time))}</td>
    </tr>
  `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}
</script>
